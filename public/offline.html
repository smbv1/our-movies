<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <title>Нет интернета · Наши фильмы</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #0c0a09;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        max-width: 20rem;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        background: #fbbf24;
        color: #09090b;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Нет интернета</h1>
      <p>Список общий и хранится на сервере, поэтому без сети его не открыть. Проверьте подключение и попробуйте ещё раз.</p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
    <script>
      // Reload by itself once the connection is back.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
